worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 10m;
  server {
    listen 8080;
    location = /health { proxy_pass http://parser:9998/version; proxy_connect_timeout 2s; proxy_read_timeout 2s; }
    location = /tika/json/text {
      limit_except PUT { deny all; }
      proxy_pass http://parser:9998;
      proxy_connect_timeout 2s;
      proxy_read_timeout 20s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_pass_request_headers off;
      proxy_set_header Content-Type application/octet-stream;
      proxy_set_header Accept application/json;
    }
    location / { return 403; }
  }
}
